<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AUI DATA HUB - Premium</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:linear-gradient(135deg,#0f172a,#1e3a8a);min-height:100vh;color:white;padding:20px}
.box{max-width:800px;margin:auto;background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border-radius:20px;padding:30px;border:1px solid rgba(255,255,255,0.2)}
h1{font-size:28px;text-align:center;margin-bottom:10px;background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;opacity:0.8;margin-bottom:25px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:20px 0}
.card{background:rgba(255,255,255,0.15);padding:20px;border-radius:15px;text-align:center;border:1px solid rgba(255,255,255,0.2)}
.card h3{font-size:20px;color:#60a5fa}
.card p{font-size:12px;opacity:0.7;margin-top:5px}
.btn{width:100%;padding:16px;background:linear-gradient(90deg,#3b82f6,#8b5cf6);border:none;border-radius:12px;color:white;font-weight:bold;font-size:16px;margin:10px 0;cursor:pointer}
.btn:active{transform:scale(0.98)}
.input{width:100%;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.1);color:white;margin:10px 0}
.result{background:rgba(0,0,0,0.3);padding:20px;border-radius:12px;margin-top:20px;display:none}
.whatsapp{background:#25D366;display:block;text-align:center;padding:16px;border-radius:12px;color:white;text-decoration:none;font-weight:bold;margin-top:20px}
</style>
</head>
<body>
<div class="box">
<h1>AUI DATA HUB</h1>
<p class="sub">Premium Fast Data for AUI Students 🚀<br>by Abba Usman Ibrahim</p>

<div class="grid">
<div class="card"><h3>MTN</h3><p>Fastest 4G</p></div>
<div class="card"><h3>Airtel</h3><p>Cheapest</p></div>
<div class="card"><h3>Glo</h3><p>Big Data</p></div>
<div class="card"><h3>9mobile</h3><p>Student</p></div>
</div>

<input id="phone" class="input" placeholder="Phone Number e.g. 08012345678">
<select id="net" class="input"><option value="mtn">MTN</option><option value="airtel">AIRTEL</option><option value="glo">GLO</option><option value="9mobile">9MOBILE</option></select>
<select id="data" class="input"><option>1GB - ₦300 - 30days</option><option>2GB - ₦600</option><option>3GB - ₦900</option><option>5GB - ₦1500</option><option>10GB - ₦2800</option></select>

<button class="btn" onclick="buy()">BUY DATA NOW - Instant Delivery ⚡</button>

<div id="res" class="result"></div>

<a class="whatsapp" href="https://wa.me/2348012345678?text=Hi%20I%20want%20to%20buy%20data%20from%20AUI%20DATA%20HUB">💬 Chat on WhatsApp to Confirm</a>

<p style="text-align:center;margin-top:20px;font-size:12px;opacity:0.6">Trusted by 500+ AUI Students • 24/7 Service<br>abbausmanibrahim55.github.io/aui-data</p>
</div>

<script>
function buy(){
let p=document.getElementById('phone').value;
let n=document.getElementById('net').value;
let d=document.getElementById('data').value;
let r=document.getElementById('res');
if(!p){alert('Enter phone number');return}
r.style.display='block';
r.innerHTML='<h3 style=color:#4ade80>✅ Order Received!</h3><br>Network: '+n.toUpperCase()+'<br>Plan: '+d+'<br>Phone: '+p+'<br><br><b>Next: Click WhatsApp button to pay & get data in 2 mins!</b>';
r.scrollIntoView();
}
</script>
</body>
</html>
