<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUI DATA HUB - Premium</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swaf;max-width:430px;margin:0 auto}
.hide{display:none!important}
.pin{min-height:100vh;padding:32px 24px;background:#070B1E}
.dots{display:flex;gap:18px;justify-content:cent
.dots i{width:18px;;border-radius:50%;background:#151D35;border:2px solid #2A375E;display:block}
.dots i.on{background:#FFD700;border-color:#FFD700;box-shadow:0 0 12px #FFD700}
.numPad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:30px}
.numPad b{background:#10172D;border:1px solid #1E2A4A;border-radius:18px;height:68px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800}
.top{padding:20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:20px;display:flex;gap:8px;align-items:center}
.logo i{width:36px;height:36px;background:linear-gradient(135deg,#FFD700,#FFB700);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#000;font-style:normal}
.logo span{color:#FFD700}
.bal{margin:16px 20px;background:linear-gradient(135deg,#121A35,#0E142A);border:2px solid #FFD700;border-radius:24px;padding:22px;box-shadow:0 0 30px rgba(255,215,0,.15)}
.balLab{color:#FFD700;font-size:11px;font-weight:800;letter-spacing:1.5px}
.balAmt{font-size:38px;font-weight:900;margin:10px 0}
.bRow{display:flex;gap:12px;margin-top:18px}
.bBtn{background:#FFD700;color:#000;padding:12px 20px;border-radius:30px;font-weight:900;font-size:13px}
.bBtn2{border:1.5px solid #FFD700;color:#FFD700;padding:12px 20px;border-radius:30px;font-weight:700;font-size:13px}
.title{padding:22px 20px 12px;display:flex;justify-content:space-between;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:0 20px}
.icon{width:64px;height:64px;border-radius:20px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;background:#10172D;border:1px solid #1E2A4A;font-size:26px}
.name{font-size:11px;color:#8A9BC3;text-align:center;font-weight:600}
.banner{margin:20px;background:#10172D;border:1px solid #FFD700;border-radius:18px;padding:16px;display:flex;gap:14px;align-items:center}
.bIco{width:52px;height:52px;background:#FFD700;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900}
.bNav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:398px;background:#10172D
